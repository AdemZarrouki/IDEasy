name: Update URLS
on:
  workflow_dispatch:
jobs:
  updateURLS:
    runs-on: ubuntu-latest
    env:
      STATUS_REPO: AdemZarrouki/ide-urls-status
      TEST_BRANCH: test/test-workflow
      URLS_REPO: AdemZarrouki/ide-urls
    steps:
      - name: Checkout ide
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Checkout ide-urls-status
        uses: actions/checkout@v3
        with:
          repository: ${{ env.STATUS_REPO }}
          ref: ${{ env.TEST_BRANCH }}
          path: ide-urls-status
          token: ${{ secrets.ACTION_PUSH_TOKEN }}
      - name: Checkout ide-urls
        uses: actions/checkout@v3
        with:
          repository: ${{ env.URLS_REPO }}
          ref: ${{ env.TEST_BRANCH }}
          path: ide-urls
          token: ${{ secrets.ACTION_PUSH_TOKEN }}
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and run url updater
        run: |
          mvn -B -ntp -Dstyle.color=always -pl url-updater -am install
          mvn -B -ntp -Dstyle.color=always -pl url-updater exec:java -Dexec.mainClass="com.devonfw.tools.ide.url.UpdateInitiator" -Dexec.args="ide-urls PT5H30M squirrel-sql"
        env:
          ACTION_PUSH_TOKEN: ${{ secrets.ACTION_PUSH_TOKEN }}
      - name: Sync status.json files to ide-urls-status
        run: |
          rsync -av --delete --prune-empty-dirs \
            --exclude='.git/' \
            --include='*/' \
            --include='status.json' \
            --exclude='*' \
            ide-urls/ ide-urls-status/
      - name: Commit and push status.json files to ide-urls-status
        run: |
          cd ide-urls-status
          git config --global user.name "${{ secrets.BUILD_USER }}"
          git config --global user.email "${{ secrets.CBUILD_USER_EMAIL }}"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update status.json"
            git push origin HEAD:${{ env.TEST_BRANCH }}
          else
            echo "No status.json changes"
          fi
      - name: Commit and push other files to ide-urls
        run: |
          cd ide-urls
          git config --global user.name "${{ secrets.BUILD_USER }}"
          git config --global user.email "${{ secrets.CBUILD_USER_EMAIL }}"
          CHANGED_NON_STATUS_FILES=$(git ls-files --modified --others --exclude-standard | grep -Ev '(^|/)status\.json$' || true)
          if [ -n "$CHANGED_NON_STATUS_FILES" ]; then
            echo "Changed non-status.json files:"
            echo "$CHANGED_NON_STATUS_FILES"
            while IFS= read -r file; do
              [ -n "$file" ] && git add "$file"
            done <<< "$CHANGED_NON_STATUS_FILES"
            git commit -m "Update URLs"
            git push origin HEAD:${{ env.TEST_BRANCH }}
          else
            echo "No non-status.json changes"
          fi

