name: Update URLS
on:
  workflow_dispatch:
jobs:
  updateURLS:
    runs-on: ubuntu-latest
    env:
      URLS_REPO: AdemZarrouki/ide-urls
      STATUS_REPO: AdemZarrouki/ide-urls-status
      TEST_BRANCH: test/test-workflow
    steps:
      - name: Checkout ide
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Checkout ide-urls (fork test branch)
        uses: actions/checkout@v3
        with:
          repository: ${{ env.URLS_REPO }}
          ref: ${{ env.TEST_BRANCH }}
          path: ide-urls
      - name: Checkout ide-urls-status (fork test branch)
        uses: actions/checkout@v3
        with:
          repository: ${{ env.STATUS_REPO }}
          ref: ${{ env.TEST_BRANCH }}
          path: ide-urls-status
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and run url updater
        run: |
          mvn -B -ntp -Dstyle.color=always -pl url-updater -am install
          mvn -B -ntp -Dstyle.color=always -pl url-updater exec:java \
            -Dexec.mainClass="com.devonfw.tools.ide.url.UpdateInitiator" \
            -Dexec.args="ide-urls ide-urls-status PT5H30M"
        env:
          GHA_TOKEN: ${{ secrets.GHA_TOKEN }}
      - name: Commit and push to ide-urls (fork test branch)
        run: |
          cd ide-urls
          git config --global user.name "${{ secrets.BUILD_USER }}"
          git config --global user.email "${{ secrets.BUILD_USER_EMAIL }}"
          if git status -z | grep -q .
          then
            git add .
            git commit -m "Test: update urls"
            git push origin HEAD:${{ env.TEST_BRANCH }}
          else
            echo "No changes, nothing to commit."
          fi

      - name: Commit and push to ide-urls-status (fork test branch)
        run: |
          cd ide-urls-status
          git config --global user.name "${{ secrets.BUILD_USER }}"
          git config --global user.email "${{ secrets.BUILD_USER_EMAIL }}"
          if git status -z | grep -q .
          then
            git add .
            git commit -m "Test: update url status"
            git push origin HEAD:${{ env.TEST_BRANCH }}
          else
            echo "No changes, nothing to commit."
          fi
  trigger_update_cve:
    runs-on: ubuntu-latest
    needs: updateURLS
    steps:
      - name: Trigger Update Security Files
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-cve.yml/dispatches \
            -d '{"ref":"main"}'
